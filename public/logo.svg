<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3987e5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3987e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redhalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d03b3b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d03b3b" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fab219"/>
    </marker>
  </defs>

  <rect width="512" height="512" rx="96" fill="#0d0d0d"/>

  <!-- faint stars -->
  <circle cx="88" cy="120" r="2" fill="#ffffff" opacity="0.25"/>
  <circle cx="430" cy="300" r="2" fill="#ffffff" opacity="0.2"/>
  <circle cx="150" cy="430" r="1.6" fill="#ffffff" opacity="0.22"/>
  <circle cx="330" cy="440" r="1.6" fill="#ffffff" opacity="0.18"/>
  <circle cx="452" cy="132" r="1.6" fill="#ffffff" opacity="0.2"/>

  <!-- orbits -->
  <circle cx="256" cy="256" r="90" fill="none" stroke="#383835" stroke-width="3"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#383835" stroke-width="3"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#383835" stroke-width="3"/>

  <!-- the catalog at the center -->
  <circle cx="256" cy="256" r="64" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="26" fill="#3987e5"/>

  <!-- healthy planets -->
  <circle cx="171" cy="287" r="11" fill="#0ca30c"/>
  <circle cx="316" cy="330" r="9" fill="#3987e5"/>
  <circle cx="108" cy="404" r="11" fill="#3987e5"/>

  <!-- the incident planet -->
  <circle cx="386" cy="181" r="40" fill="url(#redhalo)"/>
  <circle cx="386" cy="181" r="14" fill="#d03b3b"/>

  <!-- blast radius: the incident propagating along lineage to an outer asset -->
  <path d="M 398 166 Q 438 116 380 84" fill="none" stroke="#fab219" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
  <circle cx="361" cy="74" r="12" fill="#1a1a19" stroke="#fab219" stroke-width="4"/>
</svg>
